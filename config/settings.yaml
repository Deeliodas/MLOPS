# Central configuration for the Zurich Footfall Forecast feature pipeline.

project:
  name: "zurich-footfall-forecast"

data:
  location_id: 329
  location_name: "Bahnhofstrasse (Mitte)"
  source_url: "https://data.stadt-zuerich.ch/dataset/hystreet_fussgaengerfrequenzen/download/hystreet_fussgaengerfrequenzen_seit2021.csv"
  polling_interval_hours: 3

paths:
  raw_data: "data/raw"
  feature_data: "data/features"

target:
  column: "pedestrians_count"
  forecast_horizon_hours: 24

data_quality:
  verified_only: true

features:
  pedestrian_lags:
    - 24
    - 168

  rolling_windows:
    - 3
    - 6
    - 24

  rolling_end_lag_hours: 24

  calendar:
    - hour
    - day_of_week
    - weekend
    - month

  weather:
    temperature: true
    condition: true


weather_data:
  provider: "open_meteo"

  latitude: 47.37236452300696            #latitude & longitude found over https://www.gps-coordinates.net/
  longitude: 8.538305519795442
  timezone: "GMT"

  model: "dwd_icon_d2"

  historical_api_url: "https://previous-runs-api.open-meteo.com/v1/forecast"
  live_api_url: "https://api.open-meteo.com/v1/forecast"

  historical_variables:
    - temperature_2m_previous_day1
    - precipitation_previous_day1
    - weather_code_previous_day1

  live_variables:
    - temperature_2m
    - precipitation
    - weather_code

time:
  local_timezone: "Europe/Zurich"

events:
  street_parade_impact:
    - "2024-08-10"
    - "2024-08-11"
    - "2025-08-09"
    - "2025-08-10"
    - "2026-08-08"
    - "2026-08-09"

  sechselaeuten:
    - "2024-04-15"
    - "2025-04-28"
    - "2026-04-20"

feature_store:
  directory: "data/features"
  filename_prefix: "footfall_features"
  training_subdirectory: "training"
  live_subdirectory: "live"

  