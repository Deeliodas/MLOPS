name: Feature Pipeline

on:
  # Fetch and update live features every 3 hours.
  schedule:
    - cron: "15 */3 * * *"
      timezone: "Europe/Zurich"

  # Allow manual runs from the GitHub Actions UI.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m pytest -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: zurich-footfall-forecast
          workload_identity_provider: projects/1098174852521/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-feature-pipeline@zurich-footfall-forecast.iam.gserviceaccount.com

      - name: Run live feature pipeline
        run: uv run python -m footfall.features.pipeline live