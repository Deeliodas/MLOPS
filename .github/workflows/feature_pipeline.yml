name: Feature Pipeline

on:
  # Run automatically every 3 hours.
  schedule:
    - cron: "15 */3 * * *"
      timezone: "Europe/Zurich"

  # Allow manual runs from the GitHub Actions UI.
  workflow_dispatch:

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m pytest -v

      - name: Run live feature pipeline
        run: uv run python -m footfall.features.pipeline live

      - name: Upload live feature snapshot
        uses: actions/upload-artifact@v4
        with:
          name: live-feature-snapshot
          path: data/features/live/*.parquet
          retention-days: 30