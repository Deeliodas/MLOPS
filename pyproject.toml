#Project configuration for the Zurich Footfall Forecast.
#Defines the Python Version and the dependencies required to run and test the feature pipeline.

[project]
name = "zurich-footfall-forecast"
version = "0.1.0"
description = "24-hour-ahead pedestrian footfall forecasting for Bahnhofstrasse Mitte in Zurich"

requires-python = ">=3.10,<3.11"

dependencies = [
    "pandas",
    "numpy",
    "requests",
    "pyarrow",
    "pyyaml",
    "python-dotenv",
    "holidays>=0.107",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
